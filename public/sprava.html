<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#590907">
<title>Moje schůzka 1na1</title>
<link rel="icon" href="/art.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <header class="hero">
    <div>
      <h1>Moje schůzka 1na1</h1>
      <div class="chips"><span class="chip" data-icon="user">s ředitelem</span></div>
    </div>
    <img src="/art.svg" alt="">
  </header>

  <div id="msg" class="msg hidden"></div>

  <section id="detail" class="hidden">
    <div class="day">
      <div id="tile"></div>
      <div>
        <p class="big-when" id="when"></p>
        <p class="muted" id="note"></p>
        <div class="actions" id="buttons">
          <button id="btnMove" data-icon="move">Přesunout</button>
          <button id="btnCancel" class="secondary" data-icon="x">Zrušit</button>
        </div>
        <div id="confirmCancel" class="actions hidden" style="margin-top:12px">
          <button id="btnCancelYes" class="danger">Ano, zrušit schůzku</button>
          <button id="btnCancelNo" class="secondary">Ponechat</button>
        </div>
      </div>
    </div>
  </section>

  <section id="pk" class="hidden">
    <h2><span class="ico" data-icon="book"></span>Podklad k rozhovoru</h2>
    <div class="card">
      <form id="pkForm" class="form" style="margin:0">
        <div class="pkpick">
        <label class="pkopt"><input type="radio" name="podklad" value="paper" required><span class="ic" data-icon="book"></span><span>Přinesu na papíře<small>PDF přijde e-mailem</small></span></label>
        <label class="pkopt"><input type="radio" name="podklad" value="online" required><span class="ic" data-icon="list"></span><span>Vyplním online<small>do začátku schůzky</small></span></label>
      </div>
        <div class="actions" id="pkLinks"></div>
        <div class="actions hidden" id="pkSaveRow"><button type="submit" data-icon="check">Uložit volbu</button></div>
      </form>
    </div>
  </section>

  <section id="move" class="hidden">
    <h2><span class="ico" data-icon="cal"></span>Nový termín</h2>
    <div id="picker"></div>
    <div id="moveBar" class="sticky hidden">
      <div class="ticket" id="moveTo"></div>
      <div class="actions" style="margin-top:12px"><button id="btnMoveYes" data-icon="check">Přesunout sem</button><button id="btnMoveNo" class="secondary">Zpět</button></div>
    </div>
  </section>

  <p id="newLink" class="hidden"><a class="btn" href="/" data-icon="cal">Vybrat nový termín</a></p>
</main>

<script src="/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('t');
const msg = $('#msg');
let info = null, target = null;

async function load() {
  try {
    info = await api(`/api/booking?t=${encodeURIComponent(token || '')}`);
    $('#tile').innerHTML = calTile(info.slot.start);
    $('#when').textContent = cap(fmt.when(info.slot));
    $('#note').textContent = info.past ? 'Schůzka už proběhla.'
      : `Přesunout lze nejpozději ${info.rules.CANCEL_MIN_HOURS} hodinu předem na termín vzdálený aspoň ${info.rules.BOOK_MIN_HOURS} hodin. Zrušit lze nejpozději ${info.rules.CANCEL_MIN_HOURS} hodinu předem.`;
    $('#btnCancel').disabled = !info.canCancel;
    $('#btnMove').disabled = !info.canReschedule;
    $('#buttons').classList.toggle('hidden', info.past);
    $('#detail').classList.remove('hidden');
    renderPk();
  } catch (e) {
    showMsg(msg, esc(e.message), 'err');
    $('#newLink').classList.remove('hidden');
  }
}

function renderPk() {
  if (info.past) return;
  const f = $('#pkForm');
  if (info.podklad) f.querySelector(`input[value="${info.podklad}"]`).checked = true;
  const links = [];
  if (info.podklad === 'online' && info.formUrl) links.push(`<a class="btn" href="${esc(info.formUrl)}" target="_blank" rel="noopener">${icon('list')}Vyplnit online</a>`);
  if (info.podklad === 'paper') links.push(`<a class="btn" href="${esc(info.pdfUrl)}" target="_blank" rel="noopener">${icon('book')}Stáhnout PDF</a>`);
  $('#pkLinks').innerHTML = links.join('');
  $('#pkSaveRow').classList.add('hidden');
  $('#pk').classList.remove('hidden');
}
$('#pkForm').onchange = () => {
  const v = new FormData($('#pkForm')).get('podklad');
  $('#pkSaveRow').classList.toggle('hidden', v === info.podklad);
};
$('#pkForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const podklad = new FormData($('#pkForm')).get('podklad');
    await api('/api/podklad', { method: 'POST', data: { t: token, podklad } });
    info.podklad = podklad;
    await load();
    showMsg(msg, 'Volba je uložená. Podklad přišel e-mailem.');
  } catch (err) { showMsg(msg, esc(err.message), 'err'); }
};

$('#btnCancel').onclick = () => $('#confirmCancel').classList.remove('hidden');
$('#btnCancelNo').onclick = () => $('#confirmCancel').classList.add('hidden');
$('#btnCancelYes').onclick = async () => {
  try {
    await api('/api/cancel', { method: 'POST', data: { t: token } });
    $('#detail').classList.add('hidden');
    $('#move').classList.add('hidden');
    $('#pk').classList.add('hidden');
    showMsg(msg, 'Schůzka je zrušená. Potvrzení přišlo e-mailem.');
    $('#newLink').classList.remove('hidden');
  } catch (e) { showMsg(msg, esc(e.message), 'err'); }
};

$('#btnMove').onclick = () => {
  $('#move').classList.remove('hidden');
  renderPicker($('#picker'), info.freeSlots, s => {
    target = s;
    $('#moveTo').innerHTML = icon('cal') + esc(cap(fmt.when(s)));
    $('#moveBar').classList.remove('hidden');
  }, 'Momentálně nejsou vypsané žádné jiné volné termíny.');
  $('#move').scrollIntoView({ behavior: 'smooth' });
};
$('#btnMoveNo').onclick = () => { $('#move').classList.add('hidden'); $('#moveBar').classList.add('hidden'); target = null; };
$('#btnMoveYes').onclick = async () => {
  if (!target) return;
  try {
    await api('/api/reschedule', { method: 'POST', data: { t: token, slotId: target.id } });
    $('#move').classList.add('hidden');
    $('#moveBar').classList.add('hidden');
    await load();
    showMsg(msg, 'Schůzka je přesunutá. Potvrzení přišlo e-mailem.');
  } catch (e) { showMsg(msg, esc(e.message), 'err'); }
};

load();
</script>
</body>
</html>
