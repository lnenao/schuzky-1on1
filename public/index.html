<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#590907">
<title>Schůzky 1na1 s ředitelem</title>
<link rel="icon" href="/art.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <header class="hero">
    <div>
      <h1>Schůzky 1na1 s ředitelem</h1>
      <div class="chips" id="chips"></div>
    </div>
    <img src="/art.svg" alt="">
  </header>

  <div id="msg" class="msg hidden"></div>

  <section id="pick">
    <h2><span class="ico" data-icon="cal"></span>Volné termíny</h2>
    <div id="picker"><p class="muted">Načítám termíny…</p></div>

    <form id="form" class="form sticky hidden" autocomplete="on">
      <div class="ticket" id="chosen"></div>
      <div class="row2">
        <label>Jméno a příjmení<input name="name" required minlength="3" maxlength="80" autocomplete="name"></label>
        <label>E-mail<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
      </div>
      <div class="actions"><button type="submit" id="submit" data-icon="check">Rezervovat</button></div>
    </form>
  </section>

  <section id="done" class="hidden">
    <div class="card done">
      <div id="confetti" class="confetti-wrap"></div>
      <div class="badge" id="doneBadge"></div>
      <p class="big-when" id="doneWhen"></p>
      <p class="muted" id="doneMail"></p>
      <div class="actions"><a class="btn" id="manageLink" href="#" data-icon="move">Zrušit nebo přesunout</a></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
<script>
let chosen = null;
const form = $('#form'), msg = $('#msg');

async function load() {
  try {
    const { slots, place, minutes } = await api('/api/slots');
    $('#chips').innerHTML = `<span class="chip">${icon('clock')}${minutes} minut</span><span class="chip">${icon('door')}${esc(place)}</span>`;
    renderPicker($('#picker'), slots, s => {
      chosen = s;
      $('#chosen').innerHTML = icon('cal') + esc(cap(fmt.when(s)));
      form.classList.remove('hidden');
      hideMsg(msg);
    });
  } catch (e) { showMsg(msg, esc(e.message), 'err'); }
}

form.onsubmit = async e => {
  e.preventDefault();
  if (!chosen) return;
  const btn = $('#submit');
  btn.disabled = true;
  try {
    const fd = new FormData(form);
    const r = await api('/api/book', { method: 'POST', data: { slotId: chosen.id, name: fd.get('name'), email: fd.get('email') } });
    $('#pick').classList.add('hidden');
    hideMsg(msg);
    $('#confetti').innerHTML = confetti();
    $('#doneBadge').innerHTML = icon('check');
    $('#doneWhen').textContent = cap(fmt.when(r.slot));
    $('#doneMail').textContent = r.emailSent
      ? 'Zarezervováno. Potvrzení s pozvánkou do kalendáře přišlo na e-mail.'
      : 'Zarezervováno. Potvrzovací e-mail se nepodařilo odeslat, pro pozdější změny slouží odkaz níže.';
    $('#manageLink').href = `/sprava.html?t=${encodeURIComponent(r.token)}`;
    $('#done').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    showMsg(msg, esc(err.message), 'err');
    if (err.status === 409) { chosen = null; form.classList.add('hidden'); load(); }
  } finally { btn.disabled = false; }
};

load();
</script>
</body>
</html>
